name: Auto Sync Music to Firebase

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub
  schedule:
    - cron: '0 0 * * *' # Tự động chạy mỗi ngày 1 lần vào lúc 0:00 UTC

jobs:
  sync-music-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create serviceAccountKey.json from GitHub Secret
        run: |
          cat << 'EOF' > serviceAccountKey.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      - name: Run sync script
        run: node sync-music.js
